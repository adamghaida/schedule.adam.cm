<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMU-Q Schedule Planner</title>
<meta name="description" content="Unofficial schedule planner for Carnegie Mellon University in Qatar. Add the courses you are taking and see which courses still fit, which clash, and which prerequisites you meet.">
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11121A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234640D2'/%3E%3Crect x='6' y='8' width='8' height='7' rx='2' fill='%23fff'/%3E%3Crect x='17' y='12' width='9' height='5' rx='2' fill='%23fff' opacity='.7'/%3E%3Crect x='6' y='18' width='8' height='6' rx='2' fill='%23fff' opacity='.7'/%3E%3Crect x='17' y='20' width='9' height='4' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><h1>CMU-Q Schedule Planner</h1><span class="tag">Unofficial</span></div>
    <div class="seg" id="semSeg" role="group" aria-label="Semester"></div>
  </header>

  <nav class="viewtabs" id="viewTabs" aria-label="Switch view">
    <button type="button" data-view="courses" aria-pressed="true">Courses <b id="vtFit"></b></button>
    <button type="button" data-view="schedule" aria-pressed="false">My schedule <b id="vtOn"></b></button>
  </nav>

  <div class="cols" id="cols" data-view="courses">
    <section class="panel catalog" aria-label="Courses">
      <div class="count" aria-live="polite">
        <div class="count-big" id="countBig">0</div>
        <div class="count-label" id="countLabel"></div>
        <div class="count-sub" id="countSub"></div>
        <div class="delta" id="delta" hidden></div>
        <div class="meter" aria-hidden="true"><i id="meterFill" style="width:100%"></i></div>
      </div>

      <div class="tools">
        <input class="field" id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search 15-122 or calculus, or paste a list of course numbers" aria-label="Search courses">
        <select class="field" id="dept" aria-label="Department"></select>
      </div>
      <div class="bulk" id="bulk" hidden></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Which courses to list"></div>
      <div class="opts">
        <label><input type="checkbox" id="tba"> Include courses with no set time</label>
        <label id="canTakeWrap" hidden><input type="checkbox" id="canTake"> Only courses I can take</label>
      </div>
      <div class="taken" id="takenBox"></div>
      <ul class="rows" id="rows"></ul>
    </section>

    <aside class="panel side" aria-label="Your schedule">
      <div class="side-head"><h2>Your schedule</h2><div class="units" id="units"></div></div>
      <div class="plans" id="plans"></div>
      <details class="wkwrap" id="weekWrap" open>
        <summary>Week view</summary>
        <div class="wk" id="week"></div>
      </details>
      <div id="picksWrap"></div>
      <div class="sub" id="maybeWrap" hidden></div>
      <details class="blockform" id="blockDetails">
        <summary>Block off other time (work, commute, prayer)</summary>
        <form class="bform" id="blockForm" novalidate>
          <label class="grow">Label<input class="field" type="text" id="bName" maxlength="30" placeholder="Work"></label>
          <div>
            <div class="note" style="font-size:12px;margin-bottom:4px">Days</div>
            <div class="daypick" id="bDays"></div>
          </div>
          <label>From<input class="field" type="time" id="bStart" value="16:00" step="300"></label>
          <label>To<input class="field" type="time" id="bEnd" value="18:00" step="300"></label>
          <button class="btn" type="submit">Block this time</button>
          <p class="formerr" id="bErr" hidden></p>
        </form>
      </details>
      <div class="side-foot">
        <button class="btn sm" id="copyBtn" type="button">Copy schedule as text</button>
        <button class="btn sm quiet" id="clearBtn" type="button">Clear this plan</button>
      </div>
    </aside>
  </div>

  <footer>
    <p id="srcNote"></p>
    <p id="saveNote"></p>
  </footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<noscript><p style="padding:16px">This planner needs JavaScript turned on.</p></noscript>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
